spring:
  config:
    import:
      - classpath:llm/${LLM_CONFIG:openai}.yml
      - classpath:llm/openai-embedding.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/swimming
    username: swimming
    password: swimming1234
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing local schema

jwt:
  secret: local-dev-secret-key-change-me-at-least-32-chars
  access-token-validity: 1h
  refresh-token-validity: 14d

app:
  cors:
    allowed-origins:
      - http://localhost:5173
  auth:
    secure-cookie: false
    google:
      client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
    com.swimming.backend.calendar.service: debug
