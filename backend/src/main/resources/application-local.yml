spring:
  datasource:
    url: jdbc:mysql://localhost:3306/swimming?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: devpass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: local-dev-secret-key-change-me-at-least-32-chars
  access-token-validity-sec: 3600
  refresh-token-validity-sec: 1209600

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
