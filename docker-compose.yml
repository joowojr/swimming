services:
  db:
    image: pgvector/pgvector:pg17
    container_name: swimming-postgres
    environment:
      POSTGRES_USER: swimming
      POSTGRES_PASSWORD: swimming1234
      POSTGRES_DB: swimming
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swimming -d swimming"]
      interval: 5s
      timeout: 5s
      retries: 10

  page-renderer:
    profiles:
      - renderer
    platform: linux/amd64
    build:
      context: ./infra/lambda/page-renderer
    image: swimming-page-renderer:local
    ports:
      - "127.0.0.1:9000:8080"

volumes:
  pg-data:
