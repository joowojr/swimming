<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Swimming — 정리부터 요구하지 않는 개인 몰입 워크스페이스</title>
  <desc id="desc">떠오른 생각을 수집하고, AI와 함께 할 일로 정리한 뒤, 한 가지 일에 몰입하는 Swimming의 흐름</desc>

  <defs>
    <linearGradient id="focus-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3761"/>
      <stop offset="1" stop-color="#5366a8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#f7f4ed"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#eceae4" stroke-width="2"/>

  <g id="title-block" transform="translate(58 48)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
    <g aria-label="swimming logo">
      <path d="M0 20 C9 5 20 5 30 18 S50 34 61 18 S81 4 89 13"
            fill="none" stroke="#1c1c1c" stroke-width="4" stroke-linecap="round"/>
      <text x="112" y="27" font-size="28" font-weight="600" letter-spacing="-1" fill="#1c1c1c">swimming</text>
    </g>

    <text x="0" y="96" font-size="16" font-weight="600" letter-spacing="1.8" fill="#485a98">
      PERSONAL FOCUS WORKSPACE
    </text>
    <text x="0" y="156" font-size="50" font-weight="650" letter-spacing="-2.2" fill="#1c1c1c">
      정리부터 요구하지 않는
    </text>
    <text x="0" y="216" font-size="50" font-weight="650" letter-spacing="-2.2" fill="#1c1c1c">
      개인 몰입 워크스페이스
    </text>
    <text x="0" y="268" font-size="21" font-weight="400" letter-spacing="-0.5" fill="#5f5f5d">
      생각은 가볍게 꺼내고, 다음 행동은 선명하게.
    </text>

    <g transform="translate(0 306)" font-size="17" font-weight="550" fill="#1c1c1c">
      <rect width="108" height="40" rx="20" fill="#e7eaf5"/>
      <circle cx="22" cy="20" r="5" fill="#5366a8"/>
      <text x="36" y="26">수집</text>

      <path d="M120 20 H145" stroke="#d4d3d0" stroke-width="2" stroke-linecap="round"/>
      <path d="M139 14 L145 20 L139 26" fill="none" stroke="#d4d3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="158" width="108" height="40" rx="20" fill="#fce9e4"/>
      <circle cx="180" cy="20" r="5" fill="#e77861"/>
      <text x="194" y="26">정리</text>

      <path d="M278 20 H303" stroke="#d4d3d0" stroke-width="2" stroke-linecap="round"/>
      <path d="M297 14 L303 20 L297 26" fill="none" stroke="#d4d3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="316" width="108" height="40" rx="20" fill="#e9f5eb"/>
      <circle cx="338" cy="20" r="5" fill="#79b089"/>
      <text x="352" y="26">몰입</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(718 42)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
    <path d="M18 44 C112 4 122 134 210 100 S319 89 385 164 S437 286 401 340"
          fill="none" stroke="#aeb8dc" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(0 16)">
      <rect width="350" height="92" rx="18" fill="#ffffff"/>
      <rect width="7" height="92" rx="3.5" fill="#5366a8"/>
      <text x="28" y="32" font-size="15" font-weight="650" letter-spacing="1.5" fill="#485a98">CAPTURE</text>
      <text x="28" y="66" font-size="22" font-weight="560" letter-spacing="-0.6" fill="#1c1c1c">떠오른 생각을 그대로 적기</text>
      <circle cx="316" cy="45" r="15" fill="#e7eaf5"/>
      <path d="M309 45 H323 M316 38 V52" stroke="#5366a8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <g transform="translate(46 140)">
      <rect width="350" height="104" rx="18" fill="#ffffff"/>
      <rect width="7" height="104" rx="3.5" fill="#e77861"/>
      <text x="28" y="32" font-size="15" font-weight="650" letter-spacing="1.5" fill="#bb4a34">ORGANIZE</text>
      <text x="28" y="66" font-size="22" font-weight="560" letter-spacing="-0.6" fill="#1c1c1c">AI가 할 일 후보로 정리</text>
      <g transform="translate(28 78)">
        <rect width="76" height="16" rx="8" fill="#e4f1ef"/>
        <rect x="84" width="58" height="16" rx="8" fill="#e6e9f3"/>
        <rect x="150" width="92" height="16" rx="8" fill="#f1f4ea"/>
      </g>
    </g>

    <g transform="translate(92 276)">
      <rect width="350" height="100" rx="18" fill="url(#focus-fill)"/>
      <text x="28" y="31" font-size="15" font-weight="650" letter-spacing="1.5" fill="#fac8bc">FOCUS</text>
      <text x="28" y="72" font-size="34" font-weight="650" letter-spacing="0.5" fill="#fcfbf8">25:00</text>
      <text x="153" y="66" font-size="20" font-weight="500" letter-spacing="-0.4" fill="#fcfbf8">한 가지에 몰입</text>
      <circle cx="316" cy="50" r="19" fill="none" stroke="#79b089" stroke-width="5" stroke-dasharray="93 27" transform="rotate(-90 316 50)"/>
    </g>
  </g>
</svg>
