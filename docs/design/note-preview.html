    <style>
        .inset-border {
            box-shadow: inset 0 0 0 0.5px theme('colors.linen-border');
        }
        .bg-hero-gradient {
            background: theme('colors.hero-gradient');
            background-size: 200% auto;
        }
        .bg-warm-sand {
            background-color: #fcfbf8;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 md:p-8 font-body text-body text-ink antialiased">
<!-- Modal Container -->
<div class="bg-warm-sand w-full max-w-lg rounded-card inset-border flex flex-col relative overflow-hidden">
    <!-- Header -->
    <div class="px-8 pt-8 pb-4 flex flex-col gap-2 relative z-10">
        <h1 class="font-headline-md text-headline-md text-ink">태스크 미리보기</h1>
        <p class="font-body text-body text-dim-gray">메모에서 추출된 할 일들입니다. 필요한 항목을 선택하세요.</p>
    </div>
    <!-- Task List Area -->
    <div class="px-8 py-4 flex flex-col gap-4 overflow-y-auto max-h-[60vh] relative z-10" id="taskList">
        <!-- Task Item 1 (Selected) -->
        <button class="task-card group w-full text-left rounded-card p-6 bg-surface flex items-start gap-4 transition-all duration-200 border border-transparent shadow-[inset_0_0_0_1px_theme(colors.linen-border)] hover:bg-surface-container-lowest" data-selected="true" onclick="toggleTask(this)">
            <div class="mt-1 w-6 h-6 rounded-full border border-linen-border flex items-center justify-center shrink-0 group-data-[selected=true]:bg-primary-container group-data-[selected=true]:border-primary-container transition-colors">
                <span class="material-symbols-outlined text-[16px] text-surface-container-lowest opacity-0 group-data-[selected=true]:opacity-100 transition-opacity">check</span>
            </div>
            <div class="flex flex-col gap-1">
                <h3 class="font-headline-sm text-headline-sm text-ink group-data-[selected=true]:text-ink">11월 2일 3시 반 미팅 관련 일정 정리</h3>
                <p class="font-caption text-caption text-dim-gray">업무 보조</p>
            </div>
        </button>
        <!-- Task Item 2 -->
        <button class="task-card group w-full text-left rounded-card p-6 bg-surface flex items-start gap-4 transition-all duration-200 border border-transparent shadow-[inset_0_0_0_1px_theme(colors.linen-border)] hover:bg-surface-container-lowest" data-selected="false" onclick="toggleTask(this)">
            <div class="mt-1 w-6 h-6 rounded-full border border-linen-border flex items-center justify-center shrink-0 group-data-[selected=true]:bg-primary-container group-data-[selected=true]:border-primary-container transition-colors">
                <span class="material-symbols-outlined text-[16px] text-surface-container-lowest opacity-0 group-data-[selected=true]:opacity-100 transition-opacity">check</span>
            </div>
            <div class="flex flex-col gap-1">
                <h3 class="font-headline-sm text-headline-sm text-ink">회식 장소 예약 - 강남역 인근 (고기)</h3>
                <p class="font-caption text-caption text-dim-gray">회식 일정 조율</p>
            </div>
        </button>
        <!-- Task Item 3 -->
        <button class="task-card group w-full text-left rounded-card p-6 bg-surface flex items-start gap-4 transition-all duration-200 border border-transparent shadow-[inset_0_0_0_1px_theme(colors.linen-border)] hover:bg-surface-container-lowest" data-selected="true" onclick="toggleTask(this)">
            <div class="mt-1 w-6 h-6 rounded-full border border-linen-border flex items-center justify-center shrink-0 group-data-[selected=true]:bg-primary-container group-data-[selected=true]:border-primary-container transition-colors">
                <span class="material-symbols-outlined text-[16px] text-surface-container-lowest opacity-0 group-data-[selected=true]:opacity-100 transition-opacity">check</span>
            </div>
            <div class="flex flex-col gap-1">
                <h3 class="font-headline-sm text-headline-sm text-ink group-data-[selected=true]:text-ink">다음주 월요일 오전 팀 주간회의 자료 준비</h3>
                <p class="font-caption text-caption text-dim-gray">주간회의 준비</p>
            </div>
        </button>
    </div>
    <!-- Footer Actions -->
    <div class="p-8 flex flex-col gap-3 relative z-10">
        <button class="w-full bg-hero-gradient text-on-primary rounded-button py-4 px-6 font-headline-sm text-headline-sm flex items-center justify-center gap-2 hover:opacity-90 transition-opacity shadow-lg">
            <span id="selectedCountText">2개 할 일 만들기</span>
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </button>
        <button class="w-full bg-transparent text-dim-gray rounded-button py-4 px-6 font-body text-body hover:bg-surface-container transition-colors">
            취소
        </button>
    </div>
</div>

<script>
    function toggleTask(element) {
        const isSelected = element.getAttribute('data-selected') === 'true';
        element.setAttribute('data-selected', !isSelected);
        updateCount();
    }

    function updateCount() {
        const selectedCards = document.querySelectorAll('.task-card[data-selected="true"]');
        const countText = document.getElementById('selectedCountText');
        countText.textContent = `${selectedCards.length}개 할 일 만들기`;
    }

    // Initial count update
    updateCount();
</script>
</body></html>
