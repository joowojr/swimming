plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.swimming'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // postgresql
    runtimeOnly 'org.postgresql:postgresql'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring AI
    implementation platform("org.springframework.ai:spring-ai-bom:2.0.0")
    // Open AI
    implementation "org.springframework.ai:spring-ai-starter-model-openai"
    // Ollama (로컬 LLM)
    implementation "org.springframework.ai:spring-ai-starter-model-ollama"

    // devtools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // aws
//	implementation 'software.amazon.awssdk:s3:2.53.3'

    // 웹 문서 수집: fetch/parse -> 본문 추출 -> 마크다운
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'net.dankito.readability4j:readability4j:1.0.8'
    implementation 'com.vladsch.flexmark:flexmark-html2md-converter:0.64.8'
    // playwright
    implementation 'com.microsoft.playwright:playwright:1.62.0'

    // API 문서 (OpenAPI 3 + Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // dotenv
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation 'io.github.cdimascio:dotenv-java:3.0.0'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'llm-eval', 'fetch-live', 'digest-live', 'postgres'
    }
}

/**
 * 원하는 링크를 직접 넣어 파싱 결과를 본다.
 *   ./gradlew fetchUrl -Purls="https://tech.kakao.com/posts/777"
 *   ./gradlew fetchUrl -Purls="https://a.com,https://b.com" -Prender=false
 *   ./gradlew fetchUrl -Purls="..." -Plines=40      # 앞 40줄만 (기본은 전체 출력)
 */
tasks.register('fetchUrl', Test) {
    group = 'verification'
    description = 'Fetches the URLs given in -Purls and prints the parsed markdown.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform { includeTags 'fetch-live' }
    filter { includeTestsMatching 'com.swimming.backend.knowledge.live.SourceFetchPlaygroundTest' }

    if (project.hasProperty('urls')) { systemProperty 'urls', project.property('urls') }
    if (project.hasProperty('render')) { systemProperty 'render', project.property('render') }
    if (project.hasProperty('lines')) { systemProperty 'lines', project.property('lines') }

    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true; events() }
}

/**
 * 링크를 넣어 수집 -> AI 소화까지 돌려보고 결과를 확인한다.
 *   ./gradlew digestUrl -Purls="https://tech.kakao.com/posts/777"
 *   ./gradlew digestUrl -Purls="..." -PllmProvider=ollama -PllmModel=qwen3:8b
 */
tasks.register('digestUrl', Test) {
    group = 'verification'
    description = 'Fetches the URLs given in -Purls and prints the AI digest result.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform { includeTags 'digest-live' }
    filter { includeTestsMatching 'com.swimming.backend.knowledge.live.SourceDigestPlaygroundTest' }

    // 'model' 은 Gradle Project 의 내장 프로퍼티와 충돌하므로 llm 접두사를 붙인다.
    ['urls', 'llmProvider', 'llmModel'].each { key ->
        if (project.hasProperty(key)) { systemProperty key, project.property(key).toString() }
    }

    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true; events() }
}

/**
 * 커서 쿼리를 진짜 PostgreSQL에 물어본다. H2(PostgreSQL 모드)로는 파라미터 타입 추론
 * 차이를 재현할 수 없어 따로 둔다.
 *   docker compose up -d && ./gradlew postgresCheck
 */
tasks.register('postgresCheck', Test) {
    group = 'verification'
    description = 'Runs repository queries against the local PostgreSQL from docker compose.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform { includeTags 'postgres' }

    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('fetchLive', Test) {
    group = 'verification'
    description = 'Runs web fetch tests that call the real internet.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'fetch-live'
    }
    filter { includeTestsMatching 'com.swimming.backend.knowledge.live.SourceFetchLiveTest' }
    testLogging { showStandardStreams = true }
}

tasks.register('llmEval', Test) {
    group = 'verification'
    description = 'Runs live LLM evaluation tests that require OPENAI_API_KEY.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'llm-eval'
    }
}
