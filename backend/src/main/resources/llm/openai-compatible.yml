# OpenAI 호환 엔드포인트로 로컬 LLM을 사용한다 (LM Studio, vLLM, llama.cpp, Ollama의 /v1 등).
# 이 경로에는 think 파라미터가 없다. thinking 제어가 필요하면 llm/ollama.yml 을 쓴다.
spring:
  ai:
    model:
      chat: openai
    openai:
      # Spring AI가 /v1/chat/completions 를 붙이므로 base-url 에는 /v1 을 넣지 않는다.
      # LM Studio 1234, vLLM 8000, Ollama 11434.
      base-url: ${LOCAL_LLM_BASE_URL:http://localhost:1234}
      # 대부분의 로컬 서버는 키를 검사하지 않지만 헤더 자체는 필요하다.
      api-key: ${LOCAL_LLM_API_KEY:local}

app:
  llm:
    provider: openai-compatible
    model: ${LLM_MODEL:qwen3-8b}
    max-tokens: 2000
    temperature: 0.0
