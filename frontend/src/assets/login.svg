<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
    <defs>
        <!-- Warm water glide trail -->
        <linearGradient id="streamGlide" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ebf4ff" stop-opacity="0.8"/>
            <stop offset="35%" stop-color="#d9ebff" stop-opacity="0.5"/>
            <stop offset="70%" stop-color="#f5e8ff" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>

        <!-- Subtle chromatic prism momentum trail -->
        <linearGradient id="subtlePrismTrail" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1c1c1c" stop-opacity="0.05"/>
            <stop offset="25%" stop-color="#82bcff" stop-opacity="0.85"/>
            <stop offset="48%" stop-color="#2483ff" stop-opacity="0.95"/>
            <stop offset="68%" stop-color="#ff66f4" stop-opacity="0.75"/>
            <stop offset="85%" stop-color="#fe7b02" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#1c1c1c" stop-opacity="0.05"/>
        </linearGradient>

        <radialGradient id="floatGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2483ff" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#2483ff" stop-opacity="0"/>
        </radialGradient>

        <!-- Soft shadow filters -->
        <filter id="gentlePersonShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1c1c1c" flood-opacity="0.08"/>
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2483ff" flood-opacity="0.12"/>
        </filter>

        <filter id="paperFloat" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#1c1c1c" flood-opacity="0.09"/>
        </filter>
    </defs>

    <!-- Calm Orbit Rings (ADHD calming rhythmic guidance, very subtle) -->
    <g fill="none" opacity="0.4">
        <ellipse cx="450" cy="310" rx="420" ry="210" stroke="#eeebe2" stroke-width="1.2" stroke-dasharray="5 7"/>
        <ellipse cx="450" cy="310" rx="320" ry="160" stroke="#eeebe2" stroke-width="1"/>
        <ellipse cx="450" cy="310" rx="200" ry="100" stroke="#eeebe2" stroke-width="1" stroke-dasharray="3 5"/>
    </g>

    <!-- Flowing Water Ribbons (Soft, painterly vector currents) -->
    <path d="M 20 370 C 180 230, 270 430, 450 310 C 630 190, 720 370, 880 280"
          fill="none" stroke="url(#streamGlide)" stroke-width="72" stroke-linecap="round"/>

    <path d="M 50 380 C 190 250, 290 440, 460 320 C 630 200, 740 370, 860 295"
          fill="none" stroke="#e3efff" stroke-width="24" stroke-linecap="round" opacity="0.7"/>

    <!-- The Swimming Wave Curve (Organic wave track serving as the glide lane for the swimmer) -->
    <path d="M 70 380 C 180 210, 310 210, 420 360 C 520 490, 660 470, 750 320 S 830 190, 870 230"
          fill="none" stroke="#2483ff" stroke-width="10" stroke-linecap="round" opacity="0.14"/>

    <!-- Prismatic Momentum Track -->
    <path d="M 90 380 C 190 215, 310 215, 420 360 C 520 490, 660 470, 745 325 S 820 200, 860 235"
          fill="none" stroke="url(#subtlePrismTrail)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Core wave line (delicate, refined) -->
    <path d="M 80 375 C 185 210, 305 210, 415 355 C 515 485, 655 465, 740 320 S 815 195, 855 230"
          fill="none" stroke="#1c1c1c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtle ripples around the wave crest -->
    <path d="M 260 235 C 310 230, 360 260, 395 300" fill="none" stroke="#82bcff" stroke-width="2" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 6"/>
    <path d="M 450 405 C 500 440, 560 450, 610 430" fill="none" stroke="#82bcff" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

    <!-- Soft water glow right beneath the swimmer -->
    <ellipse cx="470" cy="275" rx="140" ry="55" fill="url(#floatGlow)"/>

    <!-- ==================== HERO ILLUSTRATION: THE SWIMMER ==================== -->
    <g id="flowSwimmer" transform="translate(290, 140)" filter="url(#gentlePersonShadow)">

        <!-- Water ripples right under the body -->
        <ellipse cx="120" cy="140" rx="105" ry="34" fill="#2483ff" opacity="0.08"/>
        <ellipse cx="110" cy="135" rx="80" ry="22" fill="#82bcff" opacity="0.16"/>

        <!-- Gentle wake currents -->
        <path d="M -30 165 C -10 145, 20 140, 50 142" fill="none" stroke="#2483ff" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
        <path d="M 190 145 C 225 140, 265 152, 290 170" fill="none" stroke="#82bcff" stroke-width="2.8" stroke-linecap="round" opacity="0.5"/>

        <!-- 1. Lower Body & Legs -->
        <path d="M -45 150 C -25 140, 10 128, 45 125" fill="none" stroke="#1c1c1c" stroke-width="10.5" stroke-linecap="round"/>
        <path d="M -45 150 Q -58 153 -62 146" fill="none" stroke="#1c1c1c" stroke-width="8" stroke-linecap="round"/>
        <circle cx="-55" cy="142" r="2.5" fill="#82bcff"/>

        <path d="M -35 132 C -10 125, 22 122, 55 121" fill="none" stroke="#2c2c2b" stroke-width="12" stroke-linecap="round"/>
        <path d="M -35 132 Q -48 133 -51 126" fill="none" stroke="#2c2c2b" stroke-width="8.5" stroke-linecap="round"/>
        <circle cx="-25" cy="128" r="2.8" fill="#82bcff"/>

        <!-- 2. Torso -->
        <path d="M 38 128 C 42 104, 72 88, 120 88 C 152 88, 180 102, 182 125 C 178 136, 135 138, 72 136 Z"
              fill="#1c1c1c"/>
        <path d="M 60 107 C 88 95, 128 95, 155 104" fill="none" stroke="#3d3d3a" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 85 126 C 115 124, 145 122, 170 120" fill="none" stroke="#2a2a28" stroke-width="2.5" stroke-linecap="round"/>

        <!-- 3. Head, Hair & Peaceful Expression -->
        <path d="M 168 104 Q 180 98 190 101" fill="none" stroke="#f6cca9" stroke-width="10" stroke-linecap="round"/>
        <path d="M 196 79 C 212 79, 222 92, 220 106 C 217 117, 206 125, 193 125 C 180 125, 174 112, 177 98 C 180 85, 186 79, 196 79 Z"
              fill="#ffd9b8"/>
        <path d="M 205 99 Q 210 104 215 99" fill="none" stroke="#1c1c1c" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M 207 112 Q 212 115 217 110" fill="none" stroke="#e07a5f" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="204" cy="107" rx="5" ry="3" fill="#f8a488" opacity="0.45"/>

        <path d="M 177 98 C 172 76, 190 63, 212 63 C 228 63, 233 74, 230 85 C 227 80, 216 77, 203 80 C 193 84, 185 89, 182 98 Z"
              fill="#1c1c1c"/>
        <path d="M 171 92 C 162 86, 155 90, 151 98 C 158 95, 168 95, 174 100 Z" fill="#1c1c1c"/>
        <path d="M 180 70 C 168 65, 158 72, 152 80 C 162 74, 172 74, 180 75 Z" fill="#2483ff" opacity="0.85"/>
        <path d="M 195 62 C 186 52, 174 56, 168 62 C 176 58, 187 58, 194 62 Z" fill="#1c1c1c"/>

        <!-- 4. Left Arm -->
        <path d="M 78 128 C 86 147, 106 160, 132 155" fill="none" stroke="#1c1c1c" stroke-width="10" stroke-linecap="round"/>
        <circle cx="137" cy="154" r="7" fill="#ffd9b8"/>
        <ellipse cx="137" cy="157" rx="22" ry="7" fill="none" stroke="#82bcff" stroke-width="2" stroke-dasharray="3 4"/>
        <ellipse cx="137" cy="157" rx="14" ry="4.5" fill="none" stroke="#2483ff" stroke-width="1.5" opacity="0.6"/>

        <!-- 5. Right Arm & Hand -->
        <path d="M 138 113 C 160 118, 182 131, 195 148" fill="none" stroke="#1c1c1c" stroke-width="10.5" stroke-linecap="round"/>
        <circle cx="196" cy="150" r="7.5" fill="#ffd9b8"/>

        <!-- Stylus / Focus Pen -->
        <line x1="189" y1="139" x2="208" y2="164" stroke="#1c1c1c" stroke-width="3.8" stroke-linecap="round"/>
        <line x1="189" y1="139" x2="194" y2="145" stroke="#2483ff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="208" cy="164" r="2.2" fill="#fe7b02"/>
        <circle cx="208" cy="164" r="4.5" fill="#fe7b02" opacity="0.35"/>

        <!-- 6. Floating Minimalist Idea Pad / Notebook -->
        <g transform="translate(186, 155) rotate(13)" filter="url(#paperFloat)">
            <rect x="3" y="3" width="70" height="52" rx="6" fill="#1c1c1c" opacity="0.12"/>
            <rect x="0" y="0" width="70" height="52" rx="6" fill="#ffffff" stroke="#e8e6df" stroke-width="1.5"/>
            <line x1="0" y1="4" x2="0" y2="48" stroke="#2483ff" stroke-width="4.5" stroke-linecap="round"/>
            <line x1="12" y1="14" x2="42" y2="14" stroke="#1c1c1c" stroke-width="2.6" stroke-linecap="round"/>
            <line x1="12" y1="23" x2="56" y2="23" stroke="#8a8a85" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="32" x2="48" y2="32" stroke="#8a8a85" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="41" x2="34" y2="41" stroke="#2483ff" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 50 36 L 55 41 L 62 32" fill="none" stroke="#107e3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Floating inspirations & dopamine particles -->
        <path d="M 270 120 L 274 126 L 280 126 L 275 130 L 277 136 L 270 132 L 263 136 L 265 130 L 260 126 L 266 126 Z"
              fill="#82bcff" opacity="0.85"/>
        <circle cx="288" cy="148" r="3.2" fill="#fe7b02"/>
        <circle cx="304" cy="175" r="2.4" fill="#ff66f4"/>
        <circle cx="258" cy="190" r="3" fill="#2483ff"/>
        <circle cx="230" cy="105" r="2" fill="#fe7b02" opacity="0.7"/>

        <circle cx="236" cy="70" r="4" fill="#2483ff" opacity="0.25"/>
        <circle cx="248" cy="52" r="6" fill="#82bcff" opacity="0.3"/>
        <circle cx="264" cy="32" r="8" fill="#e8f2ff" opacity="0.5"/>
    </g>

    <!-- Ambient Floating Paper Sheets -->
    <g transform="translate(140, 260) rotate(-12)" opacity="0.75" filter="url(#paperFloat)">
        <rect width="44" height="34" rx="4" fill="#ffffff" stroke="#eceae4" stroke-width="1.2"/>
        <line x1="8" y1="10" x2="28" y2="10" stroke="#b0afa9" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="8" y1="18" x2="36" y2="18" stroke="#d4d3ce" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="8" y1="26" x2="22" y2="26" stroke="#2483ff" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    </g>

    <g transform="translate(720, 370) rotate(18)" opacity="0.7" filter="url(#paperFloat)">
        <rect width="40" height="30" rx="4" fill="#ffffff" stroke="#eceae4" stroke-width="1.2"/>
        <circle cx="12" cy="15" r="4.5" fill="#edf9f0"/>
        <path d="M 10 15 L 12 17 L 15 13" stroke="#107e3e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <line x1="20" y1="15" x2="32" y2="15" stroke="#a0a09b" stroke-width="1.6" stroke-linecap="round"/>
    </g>


    <!-- Gentle ambient sensory particles -->
    <g opacity="0.65">
        <circle cx="120" cy="180" r="2.5" fill="#82bcff"/>
        <circle cx="220" cy="450" r="3" fill="#2483ff"/>
        <circle cx="780" cy="170" r="2" fill="#fe7b02"/>
        <circle cx="820" cy="420" r="2.8" fill="#ff66f4"/>
        <circle cx="670" cy="240" r="2" fill="#82bcff"/>
        <circle cx="360" cy="520" r="2.2" fill="#fe7b02" opacity="0.6"/>
        <circle cx="580" cy="110" r="2.4" fill="#2483ff"/>
    </g>
</svg>