# 로컬 LLM을 Ollama 네이티브 API로 사용한다.
#   ollama serve && ollama pull qwen3:8b
# think 를 설정할 수 있는 유일한 경로다. OpenAI 호환 /v1 에는 이 파라미터가 없다.
spring:
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # 모델은 직접 pull 한다. 기동 중 자동 다운로드로 오래 멈추는 것을 막는다.
        pull-model-strategy: never

app:
  llm:
    provider: ollama
    model: ${LLM_MODEL:qwen3:8b}
    max-tokens: 2000
    temperature: 0.0
    ollama:
      # 기본값 2048은 시스템 프롬프트와 Folder/Task 컨텍스트를 담기에 부족해 조용히 잘린다.
      num-ctx: ${LLM_NUM_CTX:3000}
      keep-alive: ${LLM_KEEP_ALIVE:10m}
      # qwen3 같은 추론 모델의 thinking. 켜면 max-tokens 예산을 나눠 쓰고 응답도 느려진다.
      think: ${LLM_THINK:false}
