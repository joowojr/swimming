spring:
  datasource:
    url: jdbc:mysql://localhost:3306/swimming?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: swimming
    password: swimming1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: local-dev-secret-key-change-me-at-least-32-chars
  access-token-validity: 1h
  refresh-token-validity: 14d

app:
  cors:
    allowed-origins:
      - http://localhost:5173
  auth:
    secure-cookie: false

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
