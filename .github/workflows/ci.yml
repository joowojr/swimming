name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# A superseded run on the same branch has nothing left to verify.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # 마크다운만 바뀐 커밋은 빌드를 돌리지 않는다. '!' 패턴은 순서대로
            # 적용되므로 포함 규칙 뒤에 와야 한다.
            backend:
              - 'backend/**'
              - '!**/*.md'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '!**/*.md'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Tests run against H2 and the llm-eval tag is excluded by build.gradle,
      # so no database and no OPENAI_API_KEY are needed here.
      - run: ./gradlew build --no-daemon

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # npm run build is "tsc -b && vite build", so this is the type check too.
      - run: npm run build
