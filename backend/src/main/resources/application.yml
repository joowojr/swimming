spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    properties:
      hibernate:
        format_sql: true
      hibernate.type.json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  ai:
    model:
      # 이 서비스가 쓰는 모델은 chat 뿐이다. 나머지 오토컨피그는 기본이 활성이라
      # 꺼두지 않으면 쓰지도 않는 OpenAI 자격증명을 요구하고, 스타터가 둘이라 빈도 중복된다.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
      # chat 과 app.llm.* 은 여기서 정하지 않는다. 프로필이 llm/ 아래 조각 하나를
      # spring.config.import 로 끌어다 쓰고, 그 파일이 유일한 출처가 된다.

app:
  calendar:
    holiday:
      kasi:
        base-url: https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo
        # 공공데이터포털의 Encoding 인증키를 그대로 사용한다.
        service-key: ${KASI_HOLIDAY_API_KEY:}
        connect-timeout: 3s
        response-timeout: 5s
  prompt:
    locations:
      task-organizer: ${TASK_ORGANIZER_PROMPT_PATH:classpath:prompts/task-organizer/classify.md}
      task-extractor: ${TASK_EXTRACTOR_PROMPT_PATH:classpath:prompts/task-organizer/extract.md}
      source-digest: ${SOURCE_DIGEST_PROMPT_PATH:classpath:prompts/knowledge/digest.md}
      node-resolution: ${NODE_RESOLUTION_PROMPT_PATH:classpath:prompts/knowledge/node-resolution.md}
    # 골격의 <!-- fragment: 이름 --> 줄에 끼워 넣는다.
    fragments:
      splitting: classpath:prompts/task-organizer/_splitting.md
      titles: classpath:prompts/task-organizer/_titles.md
  knowledge:
    resolution:
      similar-source-limit: 5
      subject-top-k: 3
    digest:
      # LLM 입력 상한. 이보다 짧은 문서는 손대지 않고 통째로 넣는다.
      max-input-length: 40000
      # 헤딩 하나가 가져갈 최소 분량. 구간 수가 적어 예산이 남으면 이보다 늘려 상한을 채운다.
      section-budget: 800
    fetch:
      # 사용자가 한 번에 여러 링크를 저장해도 상대 서버를 몰아치지 않는 선.
      concurrency: 4
      timeout: 15s
      max-body-bytes: 4194304
      # 측정 기준(마크다운 변환 후 전체 길이):
      #   Spring AI ChatClient 47,686자 / Spring Data JPA Query Methods 56,711자
      #   Wikipedia MCP 21,316자 / Spring Boot Externalized Configuration 123,835자
      # 80,000이면 마지막 것 같은 대형 챕터 문서만 잘린다.
      max-content-length: 80000
      # 링크를 뺀 실제 문장이 이보다 짧으면 본문 추출 실패로 보고 og:description 으로 대체한다.
      # 실측: 로그인 벽 페이지 183~271자 / 가장 짧은 정상 문서 2,154자.
      min-meaningful-length: 300
      user-agent: SwimmingBot/0.1 (+https://swimming.app)
      render:
        # JavaScript로 본문을 그리는 페이지(tech.kakao.com, d2.naver.com 등)만 대상.
        # 브라우저는 백엔드 컨테이너가 아니라 전용 Lambda에서 돈다. 켜기 전에 함수가 배포되어
        # 있어야 하고, 호출하는 역할에 lambda:InvokeFunction 권한이 있어야 한다.
        # 배경은 docs/enhance/0907_렌더링_폴백_Lambda_분리.md 참고.
        enabled: ${KNOWLEDGE_FETCH_RENDER_ENABLED:false}
        function-name: ${KNOWLEDGE_FETCH_RENDER_FUNCTION_NAME:}
        timeout: 20s
        # 실측: 렌더링이 필요했던 페이지가 74자·322자, 정상이지만 짧았던 페이지가 3,750자.
        min-content-length: 1000
  place:
    background:
      cdn-base-url: ${PLACE_CDN_BASE_URL}
