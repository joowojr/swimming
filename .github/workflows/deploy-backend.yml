name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'compose.production.yaml'
      - 'infra/scripts/deploy-backend.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Two releases must never render backend.env and swap containers at once.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        # The repository is set to IMMUTABLE, so a moving tag such as latest
        # cannot be re-pushed. The commit SHA is the tag, which also makes the
        # running image traceable back to a commit.
        run: echo "uri=$REGISTRY/$REPOSITORY:$GITHUB_SHA" >>"$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Release through SSM
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          compose_b64=$(base64 -w0 compose.production.yaml)
          script_b64=$(base64 -w0 infra/scripts/deploy-backend.sh)

          # The compose file and the deploy script are shipped from the
          # repository on every release, so what runs on the host is always the
          # committed version rather than whatever the last deploy left behind.
          jq -n \
            --arg compose "$compose_b64" \
            --arg script "$script_b64" \
            --arg image "$IMAGE" \
            '{
              commands: [
                "set -euo pipefail",
                "install -d -m 0750 -o root -g docker /opt/swimming",
                "install -d -m 0750 -o root -g root /opt/swimming/bin",
                "install -d -m 0750 -o root -g root /opt/swimming/config",
                ("printf %s \"" + $compose + "\" | base64 -d > /opt/swimming/compose.production.yaml"),
                ("printf %s \"" + $script + "\" | base64 -d > /opt/swimming/bin/deploy-backend"),
                "chmod 0640 /opt/swimming/compose.production.yaml",
                "chmod 0750 /opt/swimming/bin/deploy-backend",
                ("/opt/swimming/bin/deploy-backend " + $image)
              ]
            }' >/tmp/ssm-parameters.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters file:///tmp/ssm-parameters.json \
            --query Command.CommandId \
            --output text)

          echo "SSM command: $command_id"

          # The command-executed waiter gives up after 100 seconds, which is
          # shorter than a pull plus the health check window.
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$status" != "Success" ]; then
            echo "::error::deploy finished with status $status"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

      - name: Summary
        if: success()
        run: echo "Deployed \`${{ steps.image.outputs.uri }}\`" >>"$GITHUB_STEP_SUMMARY"
